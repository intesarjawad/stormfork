name: Feature request
description: Suggest a change to Stormfork.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe a possible solution and any alternatives.
