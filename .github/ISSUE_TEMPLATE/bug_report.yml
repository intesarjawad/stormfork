name: Bug report
description: Report incorrect behavior or a reproducibility problem.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, expected result and actual result. Remove secrets.
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version and revision.
