[project]
name = "stormfork-fwn"
version = "0.0.0"
description = "Separate environment that runs stormfork on small GPUs through faster-weathernext"
requires-python = ">=3.12,<3.13"
dependencies = [
  "stormfork",
  "faster-weathernext @ git+https://github.com/Raymondlol/Faster-WeatherNext.git@964be68a30ec6770942bbdea5782fdf59e112b5b",
  "weathernext @ git+https://github.com/google-deepmind/weathernext.git@f2f2c5117d2f864e2d5e7c2f9f220db5e1049dd3",
  "jax==0.11.2",
  "h5netcdf",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.11.2"]

[tool.uv]
package = false
override-dependencies = ["colabtools; sys_platform == 'never'"]

[tool.uv.sources]
stormfork = { path = "../..", editable = true }
